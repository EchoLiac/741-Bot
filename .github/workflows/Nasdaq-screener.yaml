name: Screener

on:
  schedule:
    # Mo–Fr um 12:00 UTC (13:00/14:00 MEZ/MESZ) – anpassen falls gewünscht
    - cron: "0 12 * * 1-5"
  workflow_dispatch:
  repository_dispatch:
    types: [run-screener]

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run screener
        env:
          DISCORD_WEBHOOK_SCREENER: ${{ secrets.DISCORD_WEBHOOK_SCREENER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Command kommt vom Discord-Bot (nasdaq / sp500 / pbd)
          SCREENER_COMMAND: ${{ github.event.client_payload.command || 'nasdaq' }}
        run: python screener.py
