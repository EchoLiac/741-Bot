name: Run Chart Analyst Bot Test

on:
  workflow_dispatch: # Ermöglicht das manuelle Starten per Button in GitHub

jobs:
  run-chart-check:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install discord.py google-generativeai

      - name: Chart Analyst Skript ausführen
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python chart_analyst.py
