name: Video Scanner

on:
  workflow_dispatch:

concurrency:
  group: video-scanner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run video scanner
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_VIDEOS: ${{ secrets.DISCORD_WEBHOOK_VIDEOS }}
        run: python video_scanner.py

      - name: Commit seen_videos.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add seen_videos.json

          if git diff --staged --quiet; then
            echo "Keine Änderungen an seen_videos.json"
            exit 0
          fi

          git commit -m "Update seen_videos.json"

          git pull --rebase origin main || {
            echo "Rebase fehlgeschlagen – versuche normalen Pull"
            git pull origin main --no-edit || true
          }

          git push
